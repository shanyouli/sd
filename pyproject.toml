[project]
name = "sd"
version = "0.2.3"
description = "Add your description here"
authors = [
    { name = "Shanyou Li", email = "shanyouli6@gmail.com" }
]
dependencies = [
    "typer>=0.12.3",
    "wcwidth>=0.2.13",
]

readme = "README.md"
requires-python = ">= 3.11"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
"sd" = "sd.__main__:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.12"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
pretty = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disable_error_code = [
    "arg-type",
    "assignment",
    "union-attr",
    "index",
    "no-any-return",
    "return",
    "var-annotated",
    "possibly-undefined",
]
no_implicit_optional = false

[tool.basedpyright.analysis]
reportAny = false
